# Payloads that mean the same thing whatever the server is written in.
#
# SQL, JavaScript, shell metacharacters and template syntax are understood by
# every stack that speaks them, so nothing here presumes a technology. The
# packs beside `global/` do: `../php.yaml` and the rest hold patterns that only
# mean something to one runtime.
#
# Patterns are matched against normalised text, which has already been
# percent-decoded (recursively), Unicode-folded, case-folded and stripped of
# SQL comments. Rules are therefore written once, in canonical form, rather
# than once per evasion.

#
# The SQL rules read the User-Agent as well as the request target. An access
# log records it in full, and an injection placed there reaches any application
# that stores or queries it — analytics, audit trails, "recently seen" tables.
# Each pattern is written once, as a YAML anchor on the target condition, and
# repeated by alias for the header, so the two cannot drift apart.

version: 1
rules:

  - id: sqli_union_select
    name: SQL Injection (UNION SELECT)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.95
    references: ["CAPEC-66"]
    match:
      any:
        # The words are whole words by letters only: `reunion select` and
        # `credit union selection` are prose, but a digit, a dot or `\N` before
        # `union` (`1e0union select`, `.1union select`, `\Nunion select`) is how
        # an injection gets past a filter that wants a space there, so those
        # still match. `union(select 1)` matches too, `(` being a separator.
        # Normalisation removes SQL comments, so `1/**/union/**/select` reaches
        # the rule as `1unionselect` and is not caught by this pattern.
        - field: target_decoded
          regex: &sqli_union '(?:(?<![a-z])|(?<=\\n))union[\s/(]+(all[\s/(]+)?select\b'
        - field: user_agent_decoded
          regex: *sqli_union

  # The terminator — a comment or the end of the string — is what keeps this
  # rule honest: it is what says the comparison was appended to close off a
  # query rather than being part of one. Everything before it is deliberately
  # loose, because sqlmap's default boolean series varies exactly there:
  #
  #   oak')) AND 5481=5481 AND (('SUiH'='SUiH     parenthesised
  #   oak')  AND 1646=4348 AND ('fkFQ' LIKE 'fkFQ compared with LIKE
  #   oak%'  AND 3812=6291 AND 'ZxzJ%'='ZxzJ      a % inside the operand
  #
  # All three reached the rules as nothing at all while the UNION payloads from
  # the same run were caught, so a scan showed its conclusion and not its
  # working.
  #
  # No letter may come straight before `or`/`and`. Without that the rule read
  # `a xor b = c`, `minor version = 2` and `brand new = yes` as tautologies —
  # found 2026-10-05 by pinning ordinary searches against it. A digit still
  # may, so the glued evasion `1and 1=1` stays caught.
  - id: sqli_tautology
    name: SQL Injection (always-true condition)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    references: ["CAPEC-7"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_tautology "(?<![a-z])(or|and)[\\s(]+['\"]?[0-9a-z%_]+['\"]?\\s*(=|like)\\s*['\"]?[0-9a-z%_]+['\"]?\\s*(--|#|/\\*|$)"
        - field: user_agent_decoded
          regex: *sqli_tautology

  # Counting columns, the step between finding an injection point and building
  # a UNION that fits it. Nothing covered it, so the tool saw the UNION and not
  # the dozen requests of preparation that name the attack for what it is.
  - id: sqli_column_count
    name: SQL Injection (column counting)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    references: ["CAPEC-66"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_order_by '\border\s+by\s+\d+\s*(--|#|/\*|$)'
        - field: user_agent_decoded
          regex: *sqli_order_by

  - id: sqli_time_based
    name: SQL Injection (time-based blind)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.9
    references: ["CAPEC-7"]
    # `randomblob` is the fallback when `sleep()` is unavailable, which it
    # often is: the delay comes from making the database do expensive work
    # instead of asking it to wait. `SELECT LENGTH(HEX(RANDOMBLOB(200000000)))`
    # is sqlmap's SQLite form of it, and it is a small denial of service as
    # well as a timing oracle.
    match:
      any:
        - field: target_decoded
          regex: &sqli_delay '\b(sleep|pg_sleep|benchmark|randomblob)\s*\(|waitfor\s+delay'
        - field: user_agent_decoded
          regex: *sqli_delay

  - id: sqli_schema_probe
    name: SQL Injection (schema enumeration)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.9
    match:
      any:
        - field: target_decoded
          regex: &sqli_schema 'information_schema|sysobjects|pg_catalog\.|\bsqlite_master\b'
        - field: user_agent_decoded
          regex: *sqli_schema

  - id: sqli_error_based
    name: SQL Injection (error-based)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    references: ["CAPEC-7"]
    # These payloads never return rows. They provoke a database error whose
    # text leaks the answer, so they carry no UNION, no tautology and no sleep,
    # and every other injection rule misses them.
    match:
      any:
        - field: target_decoded
          regex: &sqli_error_globals '@@(version|servername|datadir|hostname|basedir)|\bversion\s*\(\s*\)'
        - field: target_decoded
          regex: &sqli_error_functions '\b(extractvalue|updatexml)\s*\(|\bdbms_pipe\.receive_message\b'
        - field: target_decoded
          regex: &sqli_error_cast '\b(convert|cast)\s*\(.*\b(int|integer|char|varchar|nvarchar|signed)\b'
        - field: user_agent_decoded
          regex: *sqli_error_globals
        - field: user_agent_decoded
          regex: *sqli_error_functions
        - field: user_agent_decoded
          regex: *sqli_error_cast

  - id: sqli_stacked_query
    name: SQL Injection (stacked statement)
    category: injection
    owasp: "A05:2025"
    severity: critical
    confidence: 0.85
    match:
      any:
        - field: target_decoded
          regex: &sqli_stacked ';\s*(drop|insert|update|delete|truncate|alter)\s+'
        - field: user_agent_decoded
          regex: *sqli_stacked
        # The same statements where the space after the verb is gone — comment
        # stripping turns `drop/**/table` into `droptable` — each with its own
        # guard rather than a loosened `\s+`, which would let `;update=1` and
        # `;insertion_424242` through.
        - field: target_decoded
          regex: &sqli_stacked_tight ';\s*(?:truncate\b|drop(?:table|database)\b|print\s*[''"])'
        - field: user_agent_decoded
          regex: *sqli_stacked_tight
        # A whole statement as the value, closed and commented off:
        # `drop sampletable;--`, or a User-Agent of `DELETE FROM users;--`.
        - field: query_decoded
          regex: &sqli_bare_statement '(?:^|=)\s*(?:drop|truncate|delete\s+from)\s+\w+\s*;\s*(?:--|#|$)'
        - field: user_agent_decoded
          regex: *sqli_bare_statement

  # PostgreSQL's cast operator. `password::int` makes the database fail on a
  # text column and print its value in the error, and `::jsonb` opens the JSON
  # operators; nothing but SQL writes a type name after `::`. The list is type
  # names rather than "any identifier", which is what keeps C++ and Rust paths
  # (`std::vector`, `u32::max`) and IPv6 addresses (`fe80::1`) out. Below 0.85:
  # a Ruby constant such as `Foo::Text` would still read as one.
  - id: sqli_postgres_cast
    name: SQL Injection (PostgreSQL cast)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-66"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_pg_cast '[\w)''"]::(?:int[248]?|integer|bigint|smallint|numeric|real|double precision|text|varchar|char|bool|boolean|bytea|jsonb?|oid|regclass|date)\b'
        - field: user_agent_decoded
          regex: *sqli_pg_cast

  # PostgreSQL functions that reach past the table: the large-object calls read
  # and write files on the database host (`lo_import('/etc/passwd')`), the
  # `pg_read_file` family lists and reads them directly, and `overlay(... placing
  # ...)` rewrites a column a byte at a time to test its value blind. An exact
  # exploit shape each, with a required opening paren — the call, not the name.
  - id: sqli_postgres_functions
    name: SQL Injection (PostgreSQL server functions)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.9
    references: ["CAPEC-66"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_pg_functions '\blo_(?:get|import|export|open|creat|create|unlink|put|from_bytea)\s*\(|\bpg_(?:read_file|read_binary_file|ls_dir|stat_file)\s*\(|\boverlay\s*\([^)]{0,200}\bplacing\b'
        - field: user_agent_decoded
          regex: *sqli_pg_functions

  # The first half of a boolean test, before the attacker knows what closes the
  # query: `test' or 1=`, `' xor abc!`, `xor 99>`. `or` is an English word, so
  # it has to be pinned to where an injection puts it — straight after a quote
  # that broke out of a string, or as the first word of a parameter — and be
  # followed by one operand and then a comparison. A trailing `-` counts only at
  # the end of the value. That is what keeps `tea or coffee > milk`,
  # `l'or bleu - prix` and `a xor b = c` quiet.
  - id: sqli_boolean_fragment
    name: SQL Injection (boolean test fragment)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.75
    references: ["CAPEC-7"]
    match:
      any:
        - field: target_decoded
          regex: '[''"`]\s*x?or\s*[''"]?\w+[''"]?\s*(?:[<>=!]|-(?:&|$))'
        - field: query_decoded
          regex: '(?:^|&)[^=&]*=\s*x?or\s+[''"]?\w+[''"]?\s*(?:[<>=!]|-(?:&|$))'

  # Pieces of a statement that have no reading outside SQL: a subquery opened
  # inside `in (`, `having count(`, `group by ... having`, `select * from`, a
  # `select ... from t where`, `except select`, Oracle's `execute immediate`,
  # MSSQL's `xp_` procedures, a `create function name(`, MySQL's `if(1=` blind
  # test and `) like (`. Each was checked against the searches a person
  # actually types — `create table in excel`, `select a size from the list`,
  # `if(1==1) javascript`, `everything except values` stay quiet. `case when`
  # counts only where SQL puts it, after `=`, `(`, `,` or `select`, because
  # "in case when it rains then" is English. Below 0.85: a search for SQL
  # syntax itself (`select * from`) is still a search.
  - id: sqli_statement_fragment
    name: SQL Injection (statement fragment)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.75
    references: ["CAPEC-66"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_statement '\bin\s*\(\s*select\b|\bhaving\s+count\s*\(|\bgroup\s+by\b[^&]{0,120}\bhaving\b|\bselect\s+\*\s+from\b|\bselect\s+[\w.,`*\s]{1,80}?\s+from\s+[\w`.]+\s+(?:where|group\s+by|order\s+by|limit)\b|(?:[=(,]|\bselect)\s*case\s+when\b[^&]{0,120}\bthen\b|\bexcept\s+select\b|\bexcept\s+values\s*\(|\bexecute\s+immediate\b|\bxp_(?:cmdshell|regread|dirtree|fileexist|servicecontrol)\b|\bcreate\s+(?:or\s+replace\s+)?(?:function|procedure|trigger)\s+\w+\s*\(|\bif\s*\(\s*\d+\s*=(?!=)|\)\s*like\s*\('
        - field: user_agent_decoded
          regex: *sqli_statement

  # SQLite's GLOB, used where LIKE is filtered: `'or(id glob 1)--`,
  # `' and password glob password;`. Followed by a number or by `password`,
  # which is what a blind test compares against; a file pattern (`glob *.txt`)
  # is neither.
  - id: sqli_sqlite_glob
    name: SQL Injection (SQLite GLOB)
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-7"]
    match:
      any:
        - field: target_decoded
          regex: &sqli_glob '\bglob\s+(?:\d+|password)\b'
        - field: user_agent_decoded
          regex: *sqli_glob

  # The first probe of all: a parameter whose whole value is a comparison of two
  # numbers — `?id=1=1`, `?a=b,1=1`, `?a=42<=>42`, `?a=1 is not 2`. Whole
  # value, and the number must start it or follow `,` or `(`, which is what
  # leaves arithmetic alone: `2 2=4`, `1+1=2` and `3*3=9` stay quiet.
  - id: sqli_numeric_tautology
    name: SQL Injection (numeric comparison probe)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.65
    references: ["CAPEC-7"]
    match:
      any:
        - field: query_decoded
          regex: '(?:^|&)[^=&]*=(?:[^&]*[,(])?\s*\d+\s*(?:=|!=|<>|<=>)\s*\d+\s*(?:&|$)|(?:^|&)[^=&]*=\s*\d+\s+is\s+not\s+\d+\s*(?:&|$)'

  - id: xss_script_tag
    name: Cross-Site Scripting (script tag)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.9
    references: ["CAPEC-63"]
    match:
      any:
        - field: target_decoded
          regex: &xss_script '<\s*script|<\s*/\s*script\s*>'
        - field: user_agent_decoded
          regex: *xss_script

  - id: xss_event_handler
    name: Cross-Site Scripting (event handler)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.8
    match:
      any:
        - field: target_decoded
          regex: &xss_handler '\bon(error|load|click|mouseover|focus|toggle)\s*='
        - field: target_decoded
          regex: &xss_js_scheme 'javascript\s*:'
        # The User-Agent, as the SQL rules read it. Not the Referer: on both
        # medium tiers its one benign match was the click *after* a reflected
        # XSS page, still carrying the payload the previous line was caught
        # for. Reading it would accuse every request that follows an attack.
        - field: user_agent_decoded
          regex: *xss_handler
        - field: user_agent_decoded
          regex: *xss_js_scheme
        # Any handler, not only the six above — browsers keep adding them
        # (`onzoom`, `onwebkitplaybacktargetavailabilitychanged`) — but only in
        # the places an injected one sits: after the quote that closed an
        # attribute, inside a tag, or as a parameter *name* led by a space.
        # Not after `/`: the corpus certifies `.../onafe=` in a base64 value as
        # harmless, and `?online=1` is a parameter, not a handler.
        - field: target_decoded
          regex: &xss_handler_context '[''"]\s*(?:on[a-z]{3,}|formaction)\s*=|<[a-z][^>]{0,100}\son[a-z]{3,}\s*='
        - field: query_decoded
          regex: '(?:^|&)\s+on[a-z]{3,}\s*='
        - field: user_agent_decoded
          regex: *xss_handler_context

  # A JavaScript sink called as the whole value, or straight after the quote,
  # `;` or `(` that broke out of one: `?arg=alert()`, `x";settimeout(name, 1)//`.
  # These are what a reflected-XSS probe executes. Pinned to that position,
  # because a developer's search names them in prose — `javascript alert()
  # tutorial`, `window.confirm() example` stay quiet. `.call``` is a tagged
  # template, which calls a function without parentheses.
  - id: xss_sink_call
    name: Cross-Site Scripting (script function called)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.8
    references: ["CAPEC-63"]
    match:
      any:
        - field: target_decoded
          regex: &xss_sink '(?:^|[=;"''(`])\s*(?:alert|confirm|prompt|atob|btoa|eval|set(?:timeout|interval))\s*\(|\.\s*call\s*`'
        - field: user_agent_decoded
          regex: *xss_sink

  # Tags dressed to slip past a tag match: the letters of a tag name spaced
  # out (`<f o r m`, `<d i a l o g`), a namespace in front of `script`
  # (`< x: script`), and the guillemets IIS's best-fit mapping turns into
  # angle brackets (`%u00abscript%u00bb`). The spaced form is limited to tag
  # names that run script, so `a <b c d e` stays a sentence.
  - id: xss_obfuscated_tag
    name: Cross-Site Scripting (disguised tag)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.8
    references: ["CAPEC-63"]
    match:
      any:
        - field: target_decoded
          regex: &xss_obfuscated '<\s*(?:f ?o ?r ?m|d ?i ?a ?l ?o ?g|s ?c ?r ?i ?p ?t|i ?f ?r ?a ?m ?e|s ?v ?g|o ?b ?j ?e ?c ?t|e ?m ?b ?e ?d|d ?e ?t ?a ?i ?l ?s|m ?a ?r ?q ?u ?e ?e)\b(?<=\w \w)|<\s*[a-z]+\s*:\s*script|(?:%u00ab|%u2039|«|‹)\s*/?\s*script'
        - field: user_agent_decoded
          regex: *xss_obfuscated

  # Script reached through CSS, and markup that changes where a page loads
  # from: `url(javascript:` in a style, Firefox's `-moz-binding` (an XBL file
  # that runs script), `<object data=`, and `<base href` or `<link href`, which
  # re-point every relative URL or stylesheet on the page at the attacker.
  # `style=color:red;background:white` is the corpus's own harmless control.
  - id: xss_style_and_markup
    name: Cross-Site Scripting (style or markup)
    category: injection
    owasp: "A05:2025"
    severity: medium
    confidence: 0.8
    references: ["CAPEC-63"]
    match:
      any:
        - field: target_decoded
          regex: &xss_markup 'url\s*\(\s*[''"]?\s*javascript\b|-moz-binding\s*:|<\s*object\b[^>]{0,100}\bdata\b|<\s*(?:base|link)\b[^>]{0,100}\bhref\b'
        - field: user_agent_decoded
          regex: *xss_markup

  - id: command_injection
    name: OS Command Injection
    category: injection
    owasp: "A05:2025"
    severity: critical
    confidence: 0.85
    references: ["CAPEC-88"]
    match:
      any:
        # `;`, `|` and a backtick are not query separators, so a command word
        # after one is in command position. `&` is also the query-string
        # separator, and the decoded target cannot tell `&cat=shoes` from an
        # injected `%26cat%20/etc/passwd`: both read `&cat`. What does tell them
        # apart is what follows the word. A parameter name is followed by `=`
        # (after any name characters and whitespace: `cat[]=`, `cmd.x=`,
        # `id-token=`), a command by its arguments or nothing, so after `&` a
        # command word counts only when no such `=` comes next. An injected
        # `&id=1` therefore stays unmatched on purpose: `id=1` is a shell
        # variable assignment and runs nothing. A value-less flag such as
        # `?debug&id` still matches.
        - field: target_decoded
          regex: '[;|`]\s*(cat|ls|id|whoami|uname|curl|wget|nc|bash|sh|powershell|cmd)\b|&\s*(cat|ls|id|whoami|uname|curl|wget|nc|bash|sh|powershell|cmd)\b(?![\w.\-\[\]]*\s*=)'
        - field: target_decoded
          regex: '\$\(\s*\w+|\|\s*(bash|sh)\b'
        # A newline ends the intended command and starts the attacker's. Caught
        # before only when the payload happened to name a well-known file, so
        # the file was doing the work rather than the injection.
        #
        # Matched on the raw target, not the decoded one, and that is not a
        # detail: `normalize` collapses every run of whitespace to a single
        # space, so by the time a rule sees the decoded text the newline is an
        # ordinary space and indistinguishable from one. The evidence that it
        # was a newline survives only in the encoding.
        - field: target
          regex: '%0[ad](%20|\+)*(cat|ls|id|whoami|uname|curl|wget|nc|bash|sh|ping|dir|type)\b'
        # Brace expansion needs no space, so it slips a filter looking for one:
        # `{cat,/etc/passwd}` is `cat /etc/passwd`.
        - field: target_decoded
          regex: '\{(cat|ls|id|whoami|uname|curl|wget|nc|bash|sh|ping),'

  # Mail-protocol commands in a parameter a mail feature passes to an SMTP, IMAP
  # or POP server: `mail from:<...>`, `rcpt to:<postmaster>`, `ehlo host.tld`,
  # `apop user <md5>`, `a001 examine inbox`, `auth user <base64>`. Only the
  # forms with their protocol arguments — `quit`, `list 3` or `help postmaster`
  # alone are words, and stay unmatched on purpose.
  - id: mail_command_injection
    name: Mail Protocol Command Injection
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-134"]
    match:
      any:
        - field: query_decoded
          regex: '(?:^|=)\s*(?:mail\s+from|rcpt\s+to)\s*:\s*<|(?:^|=)\s*(?:ehlo|helo)\s+[\w.-]+\.[a-z]{2,}\b|(?:^|=)\s*apop\s+\w+\s+[0-9a-f]{32}\b|(?:^|=)\s*a\d{3}\s+(?:examine|select|login|fetch|list)\s|(?:^|=)\s*auth\s+\w+\s+[a-z0-9+/]{16,}={0,2}'
        # How it arrives for real: after an encoded line break in the middle of
        # a field (`subject=hi%0d%0arcpt to:<...>`). Normalisation turns the
        # break into a space, so the evidence is the raw encoding.
        - field: target
          regex: '%0[ad](?:%0[ad])?(?:%20|\+|\s)*(?:mail(?:%20|\+|\s)+from|rcpt(?:%20|\+|\s)+to|ehlo|helo|data(?:%0[ad]|&|$))\b'

  - id: nosql_injection
    name: NoSQL Injection
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    match:
      any:
        - field: target_decoded
          regex: '\$(where|ne|gt|lt|regex|exists)\b'
        # The bracketed form a query string uses to smuggle an operator into a
        # parameter (`user[$ne]=`, `q=[$lte]x`), with the operators the line
        # above lacks. `[$` has no ordinary use, so the full set is safe here.
        - field: target_decoded
          regex: '\[\s*\$(?:ne|eq|gt|gte|lt|lte|in|nin|regex|exists|where|expr|or|and|not|nor|elemmatch|size|all)\s*\]'

  - id: xxe_entity
    name: XML External Entity
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    match:
      any:
        - field: target_decoded
          regex: '<!entity|<!doctype[^>]*\bsystem\b'

  # `{{7*7}}` is how an attacker finds the hole. It was also the only thing this
  # rule matched, so a scan showed its first request and none of the ones that
  # followed — the payload that reads a file, dumps the configuration, or walks
  # Python's class hierarchy to reach `os.system`. That last one,
  # `{{''.__class__.__mro__[1].__subclasses__()}}`, is the most-used server-side
  # template RCE payload there is, and it was passing every signature here.
  #
  # The alternatives below are ordered probe, then exploitation, then the three
  # other syntaxes a template engine might use.
  #
  # **Every bounded scan here is bounded tightly, and the reason is measured.**
  # An earlier draft of this rule wrote `\{\{[^}]{0,200}(...)`, which is linear
  # but carries a brutal constant: a request line of `{{` repeated to Apache's
  # 8 KB limit cost **53 ms in that one pattern**, against an ingest budget of
  # about 36 µs a line. That is not a hang, it is a 1,500x per-line tax that a
  # crafted log can apply to every line it contains — the kind of thing
  # `SECURITY.md` names as a denial of service in scope.
  #
  # Two changes fixed it. The bound is 64 rather than 200, because every real
  # marker appears within a few characters of the braces. And Python's dunders
  # are matched *bare*, with no `{{` prefix to scan from: no innocent URL
  # contains `__subclasses__`, so the prefix bought nothing and cost everything.
  - id: template_injection
    name: Server-Side Template Injection
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.7
    references: ["CAPEC-242"]
    match:
      any:
        # The arithmetic probe, in the three syntaxes that carry it.
        - field: target_decoded
          regex: '\{\{\s*\d+\s*[*+]\s*\d+\s*\}\}|\$\{\s*\d+\s*[*+]|#\{\s*\d+\s*[*+]\s*\d+\s*\}'
        # Python's object graph: how a Jinja2 sandbox is escaped. Matched bare —
        # these names do not occur in innocent URLs, so there is nothing to gain
        # by anchoring them to the braces and a great deal to pay for it.
        - field: target_decoded
          regex: '__class__|__mro__|__subclasses__|__globals__|__builtins__|__import__'
        # A Jinja or Twig control block that opens and closes in the same
        # value (`{% if true %}49{% endif %}`) — a probe for whether the
        # server renders what it was sent. The closing tag is required, so a
        # search for the syntax itself ("jinja {% if %} syntax") stays quiet.
        - field: target_decoded
          regex: '\{%-?\s*(?:if|for)\b[^%]{1,80}%\}.{0,200}?\{%-?\s*end(?:if|for)\s*-?%\}'
        # Jinja2's own globals, and the Java runtime a Freemarker or Spring EL
        # payload reaches for. Matched bare for the same reason as the dunders.
        #
        # `runtime.` and `getclass` were dropped rather than anchored: bare,
        # `runtime.` matches the `runtime.js` that half the bundlers on earth
        # emit, and anchored to `${` it cost 11 ms on a crafted line. The names
        # kept here are the ones a payload cannot do without and a URL does not
        # contain by accident.
        - field: target_decoded
          regex: 'config\.items|lipsum|cycler|self\.__dict__|processbuilder|javax\.|java\.lang|getruntime'
        # Any call at all inside the braces. `{{ foo() }}` in a query string has
        # no innocent reading. Cheap despite the braces: `[\w.]+` fails on the
        # first character of a `{{{{…` run rather than scanning past it.
        - field: target_decoded
          regex: '\{\{\s*[\w.]+\s*\([^)]{0,64}\)'
        # ERB and JSP scriptlets — but not a tag that merely prints a variable.
        #
        # `<%=title%>` is certified harmless by the corpus and it is right to
        # be: emitting one value is what an output tag is *for*, and the string
        # turns up whenever a template is quoted, discussed, or passed through a
        # preview. The attack is an *expression* — `<%=7*7%>`, `<% if True %>`,
        # `<% system('id') %>` — so the lookahead rejects exactly one shape: a
        # single bare identifier and nothing else.
        #
        # The lookahead sits before the `=`, not after it. Placed after, the
        # optional `[=@!]?` simply backtracks to match nothing, the lookahead
        # then tests against `=title%>` — which does not start with a word
        # character, so it trivially passes — and the whole guard is bypassed.
        - field: target_decoded
          regex: '<%(?![=@!]?\s*\w+\s*%>)[=@!]?\s*[^%]{0,64}%>'
