# Who is asking, how often, and for what — as opposed to what they sent.
#
# Most of these are window rules: they fire on a run of requests whose shape
# crosses a threshold, and say nothing about any single one. Twenty 404s in a
# minute is enumeration; any one of them is a missing page. These are the rules
# that make the difference between a graph of isolated hits and one that shows
# a campaign.
#
# `multiply_encoded_request` sits here rather than with the payload rules
# because it carries no payload of its own. Encoding something twice is a
# statement about intent, not about what was sent.

version: 1
rules:

  # The names here are the ones a tool sends when it is not trying to hide, and
  # that is the whole claim: a default User-Agent is a tool announcing itself.
  # The behavioural rules below are what catch the same tool with `-H` set,
  # which is why this one is allowed to be a plain list.
  #
  # `dirb(?:uster)?` rather than `dirbuster`, because `\bdirb\b` never matched
  # inside `dirbuster` — the boundary fails on the `u` — so the shorter tool was
  # not covered by the longer one's name and had to be said separately.
  #
  # `httpx` is deliberately absent. ProjectDiscovery's scanner and the Python
  # HTTP library share the name, and `python-httpx/0.27` is a script, not a
  # scan. Matching it here would call an ordinary client a Security Scanner at
  # confidence 0.95 — the exact false alarm the comment below this rule
  # describes, reintroduced by a different route. It belongs in
  # `http_library_user_agent`, and that is where it now is.
  #
  # `zaproxy` and `burpsuite` are listed for completeness and will rarely fire:
  # ZAP mimics a browser by default and Burp forwards whatever the browser it
  # proxies sent. Neither is evidence when absent.
  - id: scanner_user_agent
    name: Security Scanner User-Agent
    category: reconnaissance
    owasp: "A01:2021"
    severity: medium
    confidence: 0.95
    match:
      any:
        - field: user_agent_decoded
          regex: '\b(sqlmap|nikto|nmap|masscan|zgrab|acunetix|nessus|openvas|wpscan|arachni|w3af|havij|wapiti|skipfish|whatweb|commix|dirb(?:uster)?|dirsearch|gobuster|ffuf|feroxbuster|wfuzz|nuclei|katana|gospider|hydra|zaproxy|burpsuite)\b'

  # A program, not a person — and that is the whole claim. `crawling`, not
  # `reconnaissance`, and the difference is not cosmetic: `is_hostile` is
  # derived from the category, so this rule was reporting every scripted client
  # as an attack while its own `severity: info` said the opposite.
  #
  # It was the entire false-alarm figure on the real log. All 20 of the 0.765%
  # were `python-requests/2.32.3` fetching `/c/garden`, `/search?q=socket`,
  # `/cart` and `/download?file=returns-policy.txt` — a script shopping, which
  # the labelled corpus calls browsing and no reasonable reader calls
  # reconnaissance.
  #
  # ADR-0008 recorded this mistake once already, in the other direction:
  # `attack-generic` reads like a family of attacks, is actually "method not
  # allowed", and mapped to `injection` it reported seven proxy requests as
  # injection attempts. The resolution there was to stop asserting what the
  # evidence does not support. A User-Agent supports "automated". It does not
  # support "hostile" — it is the cheapest field in a request to forge, which
  # is also why the confidence is 0.4.
  #
  # The observation still survives in `all_labels` and still shows in the
  # report, and a script that asks for something it should not is still caught
  # by the rule that names what it asked for.
  - id: http_library_user_agent
    name: Scripted Client
    category: crawling
    severity: info
    confidence: 0.4
    match:
      any:
        - field: user_agent_decoded
          regex: '^(curl|wget|python-requests|python-urllib|python-httpx|go-http-client|java|libwww-perl|okhttp|axios)\b'

  - id: absent_user_agent
    name: Request Without User-Agent
    category: reconnaissance
    severity: low
    confidence: 0.4
    match:
      any:
        - field: user_agent
          equals: ""

  # A path that names software by that software's own convention, answered
  # "no such thing". One request is enough here, which is why this is a
  # signature rule and not another window: the scanner in the committed
  # excerpt asks for four to six of these, waits hours, and asks again. The
  # low-and-slow window rule below wants eight, so it never fired, and 92
  # requests the truth calls enumeration were reported as ordinary browsing.
  #
  # The status condition is the whole discrimination, and without it this rule
  # would be indefensible. `/wp-admin/` answered 200 is a WordPress site's
  # administrator opening their own admin page. Answered 404 it is someone
  # asking a site that has no WordPress at all.
  #
  # `.env` and `.git/` are deliberately absent, though they are 404s for
  # well-known paths and would fit the shape. The dataset's truth calls those
  # reconnaissance and these enumeration, and the line holds: one is reaching
  # for a secret that would be readable if it were there, the other is finding
  # out which software is installed. `config_file_exposure` reads them already,
  # at a higher severity, so it keeps them either way.
  - id: known_software_probe
    name: Probe for Software the Site Does Not Run
    category: enumeration
    owasp: "A01:2021"
    severity: medium
    confidence: 0.85
    references: ["CAPEC-127"]
    match:
      all:
        - field: path_decoded
          regex: '^/(?:wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|administrator|phpmyadmin|pma|myadmin|adminer(?:\.php)?|admin\.php|shell\.php|test\.php|old|vendor/phpunit)(?:[/?]|$)'
        - field: status
          any_of: ["404", "410"]
        - field: user_agent
          regex: '\S'

  # Every rule below declares `member`: the requests it is actually about.
  # Without it a window is only a span of time, so a burst of 404s next to a
  # stretch of ordinary browsing produces a window covering both — and the
  # browsing gets labelled as enumeration. Scoping to members means the metrics
  # are computed over the requests that constitute the behaviour, and only those
  # are labelled.

  - id: directory_enumeration
    name: Directory Enumeration
    category: enumeration
    owasp: "A01:2021"
    severity: medium
    confidence: 0.9
    references: ["CAPEC-127"]
    # Members are the requests that came back "no such thing". Enumeration is
    # finding out what exists; a refusal means the thing exists and is
    # protected, which is forced browsing and has its own rule below. When this
    # rule counted refusals too it covered both behaviours, outranked the more
    # specific one, and the access-control category never reached a graph.
    member:
      all:
        - field: status
          min: 404
        - field: status
          max: 410
    window:
      span_seconds: 60
      min_requests: 20
      conditions:
        - metric: distinct_paths
          op: ">="
          value: 15
        - metric: static_asset_ratio
          op: "<="
          value: 0.2

  - id: directory_enumeration_low_slow
    name: Directory Enumeration (Low and Slow)
    category: enumeration
    owasp: "A01:2021"
    severity: medium
    confidence: 0.85
    references: ["CAPEC-127"]
    member:
      all:
        - field: status
          min: 404
        - field: status
          max: 410
    window:
      span_seconds: 300
      min_requests: 8
      conditions:
        - metric: distinct_paths
          op: ">="
          value: 6
        - metric: static_asset_ratio
          op: "<="
          value: 0.2

  - id: forced_browsing
    name: Forced Browsing (repeated refusals)
    category: access_control
    owasp: "A01:2021"
    severity: medium
    confidence: 0.8
    member:
      any:
        - field: status
          any_of: ["401", "403"]
    window:
      span_seconds: 120
      min_requests: 10
      conditions:
        - metric: distinct_paths
          op: ">="
          value: 8

  - id: credential_attack
    name: Credential Attack
    category: credential_attack
    owasp: "A07:2021"
    severity: high
    confidence: 0.8
    references: ["CAPEC-49"]
    # Restricted to authentication endpoints. Without that, any low-diversity
    # high-error traffic matches — including a paginated export.
    member:
      all:
        - field: path_decoded
          regex: '/(login|signin|sign-in|auth|oauth|session|token|account/login)'
        - field: status
          min: 400
    window:
      span_seconds: 300
      # Five, not ten. A detection threshold has to sit below the defence it is
      # watching, or it cannot see an attack against a server that defends
      # itself: the excerpt's server rate-limits a login after six failures,
      # the attacker stops at six and returns hours later, and a rule counting
      # to ten never fired on either burst. Thirteen requests reached the report
      # as a scripted client instead.
      #
      # Five is the floor because it is the one almost every authentication
      # system already uses to lock an account — the point at which failures
      # stop looking like a forgotten password. Measured on the excerpt, no
      # client that is not this attacker has more than *one* failed login in any
      # window, so the cost here was nil; the floor is set by what is defensible
      # in general rather than by what this log happens to contain.
      min_requests: 5
      conditions:
        - metric: distinct_paths
          op: "<="
          value: 3

  # `rapid_request_burst` was here: 50 requests in 10 seconds, at 5 a second,
  # called reconnaissance. Retired rather than repaired.
  #
  # It was the only rule in this file without a `member` clause, so it labelled
  # every request in the burst rather than the ones the behaviour consisted of.
  # Measured across 66,531 lines of a labelled corpus it won 469 requests and
  # was correct on none of them: 427 static assets, 25 page views, one API call,
  # and 16 enumeration lines it named reconnaissance.
  #
  # Scoping it does not help. Restricted to client errors it wins 1 line;
  # restricted to non-asset paths, 16; restricted to both, 1 — none correct.
  # Rate alone is not a signal. Sixty asset fetches in six seconds is one
  # media-heavy page over HTTP/2, and no per-request filter separates that from
  # a wordlist walk: what distinguishes them is that the page's requests are
  # sub-resources of one document, which no field here can test.
  #
  # `status >= 400` is the worst of the options, not the safest. It fixes a
  # healthy page and admits a broken one — fifty missing assets are fifty client
  # errors in ten seconds, and every visitor during a bad deploy becomes a
  # scanner.
  #
  # If a burst signal is wanted back it needs a discriminator that is not rate:
  # distinct referers across the burst, or whether the requests hang off a
  # document already fetched. That is a new window metric, not a threshold.

  - id: server_errors_provoked
    name: Server Errors Provoked
    category: exploitation
    severity: high
    confidence: 0.7
    member:
      any:
        - field: status
          min: 500
    window:
      span_seconds: 120
      min_requests: 5
      conditions:
        - metric: request_count
          op: ">="
          value: 5

  - id: multiply_encoded_request
    name: Multiply Encoded Request
    category: reconnaissance
    owasp: "A03:2021"
    severity: low
    confidence: 0.6
    match:
      any:
        - field: decode_depth
          min: 2
