# Reaching for a door rather than picking a lock: administrative areas, debug
# endpoints, and the manifests that say which version of what is installed.
#
# Mostly low-severity on their own. Their value is cumulative — one request to
# `/wp-admin` is noise, and a run of them alongside a `sensitive_file_access`
# hit is a story.

version: 1
rules:

  # A refusal, not a miss. 404 says the thing is not there; 401 and 403 say it is
  # there and this client may not have it — opposite findings, and this pack
  # already draws the line. `directory_enumeration`'s own comment puts it best:
  # "enumeration is finding out what exists; a refusal means the thing exists and
  # is protected", and `forced_browsing` keeps to it with `any_of: [401, 403]`.
  #
  # This rule did not. `status >= 400` swept 404 in with the refusals, and on the
  # committed excerpt that was the whole of its behaviour: 140 matches on admin
  # paths, every one a 404 or a 400, not one a real refusal. The truth calls them
  # enumeration or reconnaissance. Precision was 0.146 — the worst in the pack —
  # and this clause was all of it.
  - id: admin_area_probe
    name: Administrative Area Refusal
    category: access_control
    owasp: "A01:2025"
    severity: medium
    confidence: 0.6
    match:
      all:
        - field: path_decoded
          regex: '/(admin|administrator|wp-admin|phpmyadmin|manager/html|console)\b'
        - field: status
          any_of: ["401", "403"]

  # The same behaviour, refused a different way — and the far more common way.
  #
  # The rule above assumes an application answers an unauthenticated admin
  # request with 401 or 403. Most do not: they redirect to the login form, and
  # that is a 302. Measured on the committed excerpt, whose truth marks 24
  # requests as `access_control`, the rule above reached *none* of them. This one
  # reaches 13, and claims nothing the pack did not already claim.
  #
  # A separate rule rather than a wider status test on that one, because a match
  # block takes exactly one combinator: "path matches AND (refused OR
  # redirected)" cannot be written as a single block. Two named rules also read
  # better in a report than one whose name no longer says what it matched.
  #
  # Deliberately not "any status". That reaches 19 of the 24 and also claims
  # five `injection` and two `exploitation` requests as access control — a
  # confident wrong answer in place of a miss, which is the worse trade.
  #
  # KNOWN FALSE POSITIVE, measured 2026-09-18 and not yet acted on. Every figure
  # above comes from a corpus that contained no legitimate administrator: no
  # persona in it ever requested an admin path, and the crawler avoids `/admin/`
  # per robots.txt. So the only clients ever bounced to a login form there were
  # attackers, and 13 for 13 was the arithmetic of an absent case rather than a
  # working distinction.
  #
  # On `2026-09-17-small`, the first build to carry one, the same match block
  # scores 12 hostile against 57 benign — precision 0.174. Every benign match is
  # an administrator's first request of a visit, because the application answers
  # an unauthenticated admin request with a 302 to its login form, which is
  # exactly what this rule was written to catch and exactly what a real
  # administrator receives.
  #
  # The rule is not measuring access control. It is measuring "somebody was sent
  # to a login form", and until that build existed, only attackers ever were.
  #
  # Left as it stands deliberately, pending a decision measured on this project's
  # own corpus rather than a relayed figure. The candidates are a category that
  # does not imply hostility, a confidence low enough to lose to any real signal,
  # or requiring a second admin request in the same session — an attacker keeps
  # going after the bounce, an administrator signs in. Whichever is chosen has to
  # be scored on both axes before it lands; see the rulepack ledger.
  - id: admin_area_redirect
    name: Administrative Area, Redirected Away
    category: access_control
    owasp: "A01:2025"
    severity: medium
    confidence: 0.55
    match:
      all:
        - field: path_decoded
          regex: '/(admin|administrator|wp-admin|phpmyadmin|manager/html|console)\b'
        - field: status
          any_of: ["302", "303"]

  - id: debug_endpoint_probe
    name: Debug or Status Endpoint Probe
    category: reconnaissance
    owasp: "A02:2025"
    severity: medium
    confidence: 0.8
    match:
      any:
        - field: path_decoded
          regex: '/(phpinfo|server-status|server-info|actuator|debug|trace|env)\b'

  - id: known_vulnerable_component_path
    name: Known Vulnerable Component Path
    category: reconnaissance
    owasp: "A03:2025"
    severity: low
    confidence: 0.5
    match:
      any:
        - field: path_decoded
          regex: '/(cgi-bin|struts|jenkins|solr|elasticsearch)/|/wp-content/plugins/'

  - id: dependency_manifest_probe
    name: Dependency Manifest Probe
    category: reconnaissance
    owasp: "A03:2025"
    severity: low
    confidence: 0.5
    # A manifest names every library and version the application runs, which is
    # the step before looking up what those versions are vulnerable to. Kept at
    # low confidence: these files are occasionally served on purpose, and this
    # is a hint about intent rather than evidence of an attack.
    match:
      any:
        - field: path_decoded
          regex: '/(composer|package|package-lock|bower)\.json$'
        - field: path_decoded
          regex: '/(composer|yarn|gemfile|package)\.lock$|/(gemfile|pipfile|go\.mod|pom\.xml)$'
        - field: path_decoded
          regex: '/requirements(-[a-z]+)?\.txt$'

  # Source-tree filenames asked for over HTTP.
  #
  # A deployment that serves `/LICENSE`, `/.gitignore` or `/Dockerfile` has its
  # repository where its document root should be, and a client asking for them
  # is finding that out. The run is the tell: `/`, `HEAD /`, `/LICENSE`,
  # `/.gitignore`, `/.well-known/security.txt`, `/CHANGELOG.md`, most of them
  # 404, in under a minute.
  #
  # This exists because those sixteen requests were previously caught by the
  # *User-Agent* — `python-requests` — and nothing else. That was evidence of
  # automation and was being read as evidence of intent, at the cost of twenty
  # false alarms on a script that was merely shopping. The behaviour is the
  # evidence; the client's choice of HTTP library is not. The same run from a
  # browser User-Agent had been going entirely unnoticed, and is now caught too.
  #
  # ## What is deliberately not in the list
  #
  # `/robots.txt` and `/sitemap.xml` sit at the same place in the tree and look
  # like they belong here. They are fetched 47 times each in the measured corpus
  # and the truth calls every one of them *crawling* — they are what a crawler
  # is supposed to read. `/favicon.ico` and `/apple-touch-icon.png` likewise.
  # A list assembled by theme rather than by evidence would have swept up all
  # four.
  #
  # `/.well-known/` is named one file at a time rather than as a prefix, because
  # the tree is a live standard: ACME challenges renew certificates, and
  # browsers fetch `change-password` on their own. Only `security.txt` appears
  # in the corpus, and only `security.txt` is claimed here.
  #
  # LOW, at 0.6. One request for `/LICENSE` is weak — a software vendor might
  # genuinely publish one — and it is the run that carries the meaning, which
  # `forced_browsing` and `server_errors_provoked` are already shaped to see.
  - id: project_metadata_probe
    name: Project Metadata Probe
    category: reconnaissance
    owasp: "A02:2025"
    severity: low
    confidence: 0.6
    references: ["CAPEC-118"]
    match:
      any:
        # Files a repository has and a web root should not.
        - field: path_decoded
          regex: '^/(license|readme|changelog|changes|contributing|authors|notice|install|upgrade)(\.(md|txt|rst))?$'
        - field: path_decoded
          regex: '^/(makefile|dockerfile|docker-compose\.ya?ml|procfile|vagrantfile|gruntfile\.js|gulpfile\.js|webpack\.config\.js|rollup\.config\.js|tsconfig\.json|jest\.config\.js)$'
        # Dotfiles that configure a checkout, not a site.
        - field: path_decoded
          regex: '^/\.(gitignore|gitattributes|gitmodules|editorconfig|dockerignore|npmrc|nvmrc|yarnrc|babelrc|eslintrc(\.\w+)?|prettierrc(\.\w+)?|travis\.yml|circleci)'
        # Cross-domain policy files, and the one `.well-known` entry that is a
        # disclosure target rather than a live protocol.
        - field: path_decoded
          regex: '^/(crossdomain\.xml|clientaccesspolicy\.xml|\.well-known/security\.txt)$'

  # A session identifier arriving in the URL, from a link somewhere else.
  #
  # Session fixation: the attacker picks a session id, sends you a link that
  # carries it, and waits for you to sign in. The session you authenticate is
  # one they already know. It is the oldest trick against an application that
  # accepts a session id from anywhere but a cookie.
  #
  # ## Both halves are required, and the corpus is unusually clear about why
  #
  # The URL alone decides nothing. These two are character-for-character
  # identical and the corpus scores them opposite ways:
  #
  #   /login?sessionid=abc123   Referer: https://myapp.com/previous   harmless
  #   /login?sessionid=abc123   Referer: https://attacker.com/        attack
  #
  # Plenty of older applications put a session id in the URL by design — PHP's
  # `session.use_trans_sid`, Java's `;jsessionid` — so matching the parameter on
  # its own would fire on every page of them. And an off-domain Referer on its
  # own is just an inbound link: the corpus has `myapp.com` with an
  # `attacker.com` Referer and *no* session parameter, marked harmless.
  #
  # `referer_offsite` compares hosts exactly rather than by registrable domain.
  # One corpus case is `app.example.com` with an `attacker.example.com` Referer,
  # described as "subdomain should not match" and expecting a detection.
  #
  # ## What this cannot do, said plainly
  #
  # It needs the Host header, and **`apache-combined` does not record one** —
  # nor does `apache-common` or `nginx-combined-forwarded`. On those logs
  # `referer_offsite` has no answer, reads 0, and this rule never fires. That is
  # deliberate: a rule with no evidence must be silent, not optimistic. It works
  # on the vhost Apache formats, every JSON format here (Caddy, Cloudflare,
  # nginx, ECS, GCP, Traefik) and `iis-w3c`, all of which carry the host.
  - id: session_fixation
    name: Session Fixation
    category: credential_attack
    owasp: "A07:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-61"]
    match:
      all:
        - field: query_decoded
          regex: '(^|&)[a-z0-9_.:-]{0,24}(sess(ion)?[_.-]?id|sessionid|jsessionid|phpsessid|phpsession|sid|cfid|cftoken|cfsid|asp\.net_sessionid|aspsessionid|jservsession|jwsession|weblogicsession|_session_id|_rails_session|laravel_session|connect\.sid|koa[.:]sess|play_session|rack\.session|sails\.sid|zend_session_id|cakephp|_flask_session|next-auth\.session-token|meteor_login_token|shiny-token)[a-z0-9_.-]{0,20}=\S'
        - field: referer_offsite
          min: 1
