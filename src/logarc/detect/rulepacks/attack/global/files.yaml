# Attacks that are about a file on the server: reaching one that was never
# meant to be served, or leaving one behind that will be.
#
# The distinction from `injection.yaml` is what the request is *for*. These ask
# the server for something; those send it something to run.

version: 1
rules:

  - id: path_traversal
    name: Path Traversal
    category: path_traversal
    owasp: "A01:2025"
    severity: high
    confidence: 0.9
    references: ["CAPEC-126"]
    match:
      any:
        - field: target_decoded
          regex: '(^|[/\\])\.\.[/\\]'
        # A traversal that starts a parameter value (`?arg=..\pineapple`,
        # `?code=../.history`), and Tomcat's `..;` path parameter, which some
        # servers normalise into a parent directory after the filter ran.
        - field: target_decoded
          regex: '=\.\.(?:[/\\]|;)|[/\\]\.\.;'

  - id: sensitive_file_access
    name: Sensitive System File Access
    category: path_traversal
    owasp: "A01:2025"
    severity: critical
    confidence: 0.95
    match:
      any:
        - field: target_decoded
          regex: &sensitive_files '/etc/(passwd|shadow|hosts)|[/\\](win\.ini|boot\.ini)|/proc/self/environ'
        # More of what a file-read probe asks for: identity maps and service
        # configs under /etc, kernel and socket state under /proc and /sys,
        # anything in root's home, private keys and cloud credentials by their
        # file names, a Docker secret, a package's manifest under node_modules.
        #
        # **In a parameter, not as the path.** `GET /.aws/credentials` is a
        # probe for a file left exposed in the web root, which
        # `config_file_exposure` reports as reconnaissance; the shopfront truth
        # agrees, 31 times. The same name handed to a parameter
        # (`?file=.aws/credentials`) asks the application to read it, which is
        # this rule. Matching the path as well took those 31 from
        # reconnaissance to path traversal in the first draft.
        - field: query_decoded
          regex: &sensitive_more '/etc/(?:subuid|subgid|sudoers|group|apache2/|nginx/|ssh/)|/proc/(?:net/tcp|sys/kernel/|version\b|self/cmdline)|/root/\.|/sys/class\b|\.ssh/id_(?:rsa|dsa|ecdsa|ed25519)\b|\.aws/credentials\b|\.docker/(?:secrets|config\.json)|(?:^|[=/])node_modules/[^/&]+/package\.json'
        # Vite's dev-server file read is the exception: the path itself is the
        # read (`/@id/__x00__...`, CVE-2025-30208's family).
        - field: path_decoded
          regex: '^/@id/__x00__'
        # A browser's User-Agent never names a file on the server; a probe
        # that put one there is asking the application to read it.
        - field: user_agent_decoded
          regex: *sensitive_files
        - field: user_agent_decoded
          regex: *sensitive_more

  - id: config_file_exposure
    name: Configuration File Probe
    category: reconnaissance
    owasp: "A02:2025"
    severity: high
    confidence: 0.9
    match:
      any:
        - field: path_decoded
          regex: '/\.(env|git/|svn/|hg/|aws/|ssh/|htpasswd|htaccess)'
        - field: path_decoded
          regex: '/(web|app|application)\.config\b|/config\.(php|json|yml|yaml)$'

  - id: backup_file_probe
    name: Backup or Source File Probe
    category: reconnaissance
    owasp: "A02:2025"
    severity: medium
    confidence: 0.75
    match:
      any:
        - field: path_decoded
          regex: '\.(bak|old|orig|save|swp|sql|tar\.gz|tgz|zip|rar|7z)$'
        # A database dump or backup archive named in a parameter
        # (`?code=backup.sql.zip`): the double extension is the giveaway, so a
        # plain `report.sql` download stays out.
        - field: query_decoded
          regex: '\.(?:sql|bak)\.(?:zip|gz|tgz|7z|rar|tar)\b'

  # A file named so the upload check sees an image and the server still runs it
  # as code. `/uploads/shell.php.jpg` is the classic shape, and the tool used to
  # read it the same way the vulnerable upload filter did: `is_static_asset`
  # looks at the last extension, so a live webshell being driven came back as
  # `Static Asset`.
  #
  # Four of these sit in the committed excerpt, answered 200, with the command in
  # the query — `?c=id`, `?c=cat /etc/passwd`. The truth calls them
  # `exploitation`; this pack called them images.
  #
  # Both halves of the pair are listed rather than matching "any two
  # extensions", which would claim `backup.tar.gz` and every other compressed
  # file. `critical` because a 200 here means the command ran, and 0.95 because
  # there is no innocent reason to name a file this way.
  - id: webshell_double_extension
    name: Webshell Disguised by a Double Extension
    category: exploitation
    owasp: "A05:2025"
    severity: critical
    confidence: 0.95
    references: ["CAPEC-650"]
    match:
      any:
        - field: path_decoded
          regex: '\.(php\d?|phtml|phar|asp|aspx|ashx|jsp|jspx|cgi|pl|py|rb|sh|exe|dll)\.(jpe?g|png|gif|bmp|webp|svg|ico|txt|pdf|zip|csv|log|bak)\b'
