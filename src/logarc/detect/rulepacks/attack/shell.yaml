# Payloads aimed at a Unix shell reached through the web server — CGI, and the
# environment it hands to the process it spawns.
#
# Separate from `global/injection.yaml`'s `command_injection` on purpose: that
# one is about shell metacharacters appearing in a parameter, which any stack
# can pass along. This is about the shell itself being the target.

version: 1
rules:

  - id: shellshock
    name: Shellshock Function Definition
    category: exploitation
    owasp: "A03:2025"
    severity: critical
    confidence: 0.95
    references: ["CVE-2014-6271"]
    match:
      any:
        - field: user_agent_decoded
          regex: '\(\s*\)\s*\{.*;\s*\}\s*;'
        - field: referer_decoded
          regex: '\(\s*\)\s*\{.*;\s*\}\s*;'

  # Shell globs standing in for the letters of a path, so a filter looking for
  # `/etc/passwd` or `/bin/bash` never sees either: `/etc/pa[s]swd`,
  # `/[e//]tc`, `/???/??t`, `/usr/[a-z]in/bash`, `/et*/passwd`. Only inside an
  # absolute path, which is what keeps `?page=page[1]` and
  # `field_metatags[0][advanced]` — both certified harmless by the corpus —
  # out of it.
  - id: shell_glob_path
    name: Shell Glob in a File Path
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-88"]
    match:
      any:
        - field: target_decoded
          regex: &shell_glob '/[a-z]{0,8}\[!?\^?[a-z?/\-]{1,8}\][a-z]{0,8}(?:/|\b)|/(?:[a-z]{0,3}\?{1,4}[a-z]{0,3})/[a-z?]{0,6}\?|/[a-z]{1,8}\?\s|/[a-z]{1,4}\*/'
        - field: user_agent_decoded
          regex: *shell_glob

  # Bash brace expansion building a command out of pieces: `{,ifconfig}`,
  # `{,cd,/etc,}`, `c{a,oun}t`, `{l,-lh}s`. JSON never opens an object with a
  # comma, and a braced pair counts only with letters on both sides, so the
  # corpus's harmless `{"single_blog_post_...":[{},{}]}` and set notation like
  # `a{b,c}` stay out.
  - id: shell_brace_expansion
    name: Shell Brace Expansion
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-88"]
    match:
      any:
        - field: target_decoded
          regex: &shell_brace '\{,[^{}]{1,60}\}|[a-z]\{-?[a-z]+,-?[a-z]+\}[a-z]|\{-?[a-z]+,-[a-z]+\}[a-z]|\{/[?a-z/]+,'
        - field: user_agent_decoded
          regex: *shell_brace

  # A command name broken up, or put behind `time`, so a filter matching the
  # word never sees it: `'wh'oami`, `"w"get`, `""p""y""t""h""o""n`, `ti''me sh
  # -c whoami`, `'time' who`. One empty quote pair alone is how SQL escapes an
  # apostrophe (`o''brien`), so splitting counts from three; and `time` counts
  # only where a command starts — the corpus certifies `time warner`, `time
  # express` and `times & schedule` as harmless, and "what time who wins" is a
  # sentence.
  - id: shell_disguised_command
    name: Shell Command Name Disguised
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.8
    references: ["CAPEC-88"]
    match:
      any:
        - field: target_decoded
          regex: &shell_disguised '(?:[a-z](?:''''|"")){3,}[a-z]|(?:^|[\s=;|&])[''"][a-z]{1,3}[''"][a-z]{2,}|(?:^|[=;|&''"])\s*[''"]?t(?:''''|"")?i(?:''''|"")?m(?:''''|"")?e[''"]?\s+(?:sh|bash|curl|wget|who|whoami|id|nc|bsdtar|python\d?|perl|cat|ls)\b'
        - field: user_agent_decoded
          regex: *shell_disguised

  # Shell syntax inside a word, which only a shell would read: an empty
  # substitution splitting a command (`pi$()ng`, `ping```), process
  # substitution (`>(tee log)`, `<(cat file)`), the classic fork bomb, and a
  # `/dev/tcp` reverse shell reached through a variable (`$d/tcp/1.2.3.4/777`).
  # A letter must come before the empty substitution, so "jquery $() selector"
  # stays a search.
  - id: shell_syntax_in_value
    name: Shell Substitution Syntax
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    references: ["CAPEC-88"]
    match:
      any:
        - field: target_decoded
          regex: &shell_syntax '[a-z](?:\$\(\)|[<>]\(\)|``)|\$\(\(\$\(\)|[<>]\((?:tee|cat|echo|sh|bash|curl|wget|nc)\b|:\(\)\s*\{\s*:\s*\|\s*:\s*&|\$\w+/(?:tcp|udp)/\d'
        - field: user_agent_decoded
          regex: *shell_syntax

  # A shell told to run a command (`bash -c "echo test"`, `busybox -c`, `$shell
  # -c`, `sh,-c,curl`), short commands chained after a separator that the
  # global rule's list leaves out (`;ps`, `;who`, `|$u wget`), `ll` on an
  # absolute path, and SQLite's dot-commands that shell out (`.shell nc ...`,
  # `.system`). `-c` has to be followed by a quote, a `$` or a command, so
  # "bash -c example" stays a search.
  - id: shell_invocation
    name: Shell Invoked with a Command
    category: injection
    owasp: "A05:2025"
    severity: critical
    confidence: 0.85
    references: ["CAPEC-88"]
    match:
      any:
        - field: target_decoded
          regex: &shell_invocation '(?:\b(?:bash|sh|ksh|zsh|dash|busybox)|\$shell)\s+-c\s+(?:["''$]|(?:curl|wget|whoami|echo|id|cat|ls|nc|uname)\b)|\bsh,-c,|[;|&`]\s*\.?(?:ps|who|w|ll|zstdcat)\b(?:\s|$)|[;|]\s*\$\w+\s+(?:cat|wget|curl)\b|;\s*\.sh\s|\b(?:zstdcat|bsdtar)\s+/|(?:^|[=;|&])\s*[''"]?ll[''"]?\s+/|(?:\\n|;)\s*\.(?:shell|system|databases)\b'
        - field: user_agent_decoded
          regex: *shell_invocation

  # A User-Agent that is a shell command line rather than a client's name: a
  # tool, a space and an argument (`ansible all -m ping`, `env --version`,
  # `set -o history`), an admin tool on its own (`visudo`, `chef-shell`), a
  # line that opens on a separator (`;chmod`, `;`cat<<<ifconfig``), or
  # a variable assigned and run (`a=nc&&$a`). Clients name themselves
  # `name/version` — `curl/8.6.0`, `Wget/1.21`, `python-requests/2.32` —
  # so a command followed by a slash is a client and stays out. Short words
  # that could start a product name (`id`, `set`, `cat`) count only before a
  # flag, a path or a variable: "ID Scanner 2.0" broke the first draft, and
  # bare `curl` and `Ruby` the second.
  - id: shell_command_as_user_agent
    name: Shell Command in the User-Agent
    category: injection
    owasp: "A05:2025"
    severity: high
    confidence: 0.85
    references: ["CAPEC-88"]
    match:
      any:
        - field: user_agent_decoded
          regex: '(?:^|=)\s*[''\"]?(?:ansible(?:-[a-z]+)?|chef(?:-[a-z]+)?|cscli|visudo|strace|nohup|whoami|uname|crontab|chmod|chown|sudo|wget|curl|ncat|bash|zsh|python\d?(?:\.\d+)?|perl|php|ruby)[''\"]?\s+[-\w./''\"$]|(?:^|=)\s*[''\"]?(?:ansible(?:-[a-z]+)?|chef(?:-[a-z]+)?|cscli|visudo|strace|nohup|crontab)[''\"]?\s*$|^\s*[''\"]?(?:env|set|cat|ls|id|sh|nc|rm|cp|mv|su|kill|perf)[''\"]?\s+[-/$]|^\s*;\s*(?:[a-z]+\b|`)|[;|]\s*(?:lwp-download|lwp-request|chmod|chown)\b|\b\w+=\w+\s*&&\s*\$\w+|^\s*\w+\s*\(\)\s*\{'
