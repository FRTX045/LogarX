# actmap CRS sidecar engine configuration.
#
# These are deliberate research decisions, not defaults. See crs/README.md.
# Only directives Coraza v3 implements are listed; ModSecurity-only directives
# such as SecUnicodeMapFile are intentionally absent.

# Never interrupt. Interruption would truncate the evidence set at the first
# blocking decision; we want every rule that matched, not a verdict.
SecRuleEngine DetectionOnly

# An Apache access log carries no request or response bodies.
SecRequestBodyAccess Off
SecResponseBodyAccess Off

# The sidecar emits its own structured evidence on stdout.
SecAuditEngine Off
SecDebugLogLevel 0
