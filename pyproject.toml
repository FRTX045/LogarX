[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logarc"
version = "0.2.0"
description = "Forensic reconstruction of per-IP web activity from server access logs, rendered as an activity graph"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "FRTX045" }]
keywords = ["forensics", "dfir", "access-log", "apache", "owasp", "activity-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

dependencies = [
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
evaluation = ["scikit-learn>=1.5,<2"]
# Kept out of `dev` on purpose: CI runs the tests, it does not build the
# desktop bundle, and PyInstaller is a slow install to pay for on every job.
package = ["pyinstaller>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
logarc = "logarc.cli.main:app"

# Installed by the `gui` extra. Kept as a separate entry point so the CLI never
# imports Qt: a headless server should be able to ingest a log without a
# windowing toolkit on it.
[project.gui-scripts]
logarc-gui = "logarc.gui.app:main"

[project.urls]
Repository = "https://github.com/FRTX045/logarc"

[tool.hatch.build.targets.wheel]
packages = ["src/logarc"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Code samples in documentation are illustrative prose, not compiled sources.
# Formatting them churns docs and fails CI on wording changes.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# These two deliberately contain lookalike characters. Detecting them is the
# point of the code, and describing them is the point of the docstring, so the
# confusable-character warnings are exactly backwards here.
"src/logarc/normalize/decode.py" = ["RUF002"]
"tests/normalize/test_decode.py" = ["RUF001"]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# The domain and detection layers carry the correctness-critical logic and are
# held to strict typing. I/O and UI layers are checked less aggressively because
# their third-party stubs are incomplete.
#
# Evaluation is in this list because it is what says whether the rest is right:
# an arithmetic slip there is a wrong accuracy figure, which is worse than a bug
# because it looks like a result.
[[tool.mypy.overrides]]
module = [
    "logarc.core.*",
    "logarc.detect.*",
    "logarc.episode.*",
    "logarc.evaluation.*",
    "logarc.triage.*",
    "logarc.sessionize.*",
]
strict = true

# These ship stubs written against a newer Python than we target, so analysing
# them fails on syntax we never execute. We only need their signatures at the
# call site, not a full check of their internals.
[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A warning nobody is shown is a warning nobody acts on. `ResourceWarning` is
# off by default, and it had been naming an unclosed reader per parsed range for
# as long as `read_range` has existed - eleven of them in one run, once asked.
#
# Turned on here rather than in CI so it is the same suite everywhere, and turned
# on now because the suite raises none: this costs nothing today and fails the
# next one immediately. Checked rather than assumed - with the reader leak put
# back, twelve tests fail, including tests that look at no warnings themselves.
#
# When a dependency deprecates something and there is nothing to do about it yet,
# narrow it with an `ignore::` line naming that warning and that module. Do not
# drop the `error`.
filterwarnings = ["error"]
markers = [
    "slow: tests that process large inputs (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/logarc"]
branch = true
# Follow the ingest workers into their own processes.
#
# `_parse_chunk` is the whole of what a parallel ingest does, and it runs in a
# spawned process, so coverage saw none of it and `ingest/parallel.py` reported
# 63% — the same misleading kind of number the `omit` below exists to avoid,
# reached by a different route and left standing. Measured, it is 90%.
#
# It is not free: the ingest tests take 44.4s with this and 33.6s without, and
# they are the only ones that spawn anything. Eleven seconds to stop a quarter
# of a module reading as untested.
#
# `bench_worker` is out of reach even so — it is a `python -m` entry point, not
# a multiprocessing worker — which is why it stays omitted below.
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
# One module, excluded because the number would be a lie, not because the code
# is unimportant.
#
# `bench_worker` is a `python -m` entry point that `benchmark` runs in a
# subprocess, so coverage never sees it execute and reports 0%. It is exercised
# by five tests in tests/cli/test_benchmark_command.py, which run real benchmarks
# and would fail if it broke — a standing 0% invited someone to "fix" it with a
# test that adds nothing.
#
# Four GUI modules used to sit here too, on the grounds that only a display can
# exercise them and that they were kept deliberately thin. Measured on
# 2026-08-26, that had stopped being true: `canvas.py` came out at 96% (473
# statements, 10 missed) and `panels.py` at 99% (244, 1) — among the best
# covered files in the tree, and hidden. `app.py` at 81% and `workers.py` at 78%
# are lower, and a low number that is true is worth more than no number, because
# only a measured file can show a regression as a fall.
#
# What the offscreen suite grew into is what changed. It now drives real
# gestures through real widgets, so most of what these modules do is reachable
# without a screen after all.
omit = [
    "src/logarc/evaluation/bench_worker.py",
]

# What the GUI numbers do not say, so that nobody reads them as saying it.
#
# `workers.py` reports 78% and `app.py` 82%, and part of what is counted missing
# there is not untested - it is untraceable. `Job.run`, `Job._report` and the
# `work()` closures inside `app.py` all execute on a thread QThreadPool made in
# C++. Coverage installs its tracer per thread through `threading.settrace`,
# which reaches threads the `threading` module started and no others, so a Qt
# thread runs Python that nothing is watching.
#
# Measured rather than argued: a counter inside `Job.run` says it ran 261 times
# during the GUI suite. Coverage reports those same lines as never run.
#
# Two ways out were tried and neither is taken:
#
# * `concurrency = ["multiprocessing", "thread"]` - identical numbers, to the
#   statement. The default already includes threads; it is foreign threads that
#   are out of reach, not unlisted ones.
# * `COVERAGE_CORE=sysmon` - `sys.monitoring` is process-wide and would see
#   them, but this coverage cannot measure branches under it. Branch coverage is
#   worth more than these lines; the omit list above exists because a number
#   that lies is worse than a number that is low.
#
# So the figures stand as they are, understated on purpose and by a known
# amount. What holds this code is behaviour: `tests/gui/test_workers.py` asserts
# a job reports sentences, figures and failures back, and none of that arrives
# unless `run` and `_report` did their work.

[tool.coverage.report]
# A floor, not a target. It is here so that coverage can only be lost on
# purpose: without one, a module can drift down a point per change and nothing
# says so until someone thinks to look.
#
# 94 against a measured 95: near enough to bite on a real slide, far enough
# that one addition which is genuinely hard to reach does not block a merge
# while its tests are being written. Raise it when the true number rises;
# lowering it is a decision worth arguing for in a commit message.
fail_under = 94
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    '^\s*\.\.\.$',  # Protocol method bodies carry no logic to cover.
]
