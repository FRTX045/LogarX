name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a commit rather than a branch. CRS changes weekly, and a detection
  # measurement that cannot name the ruleset that produced it is not reproducible
  # — docs/evaluation.md prints this revision beside its figures for that reason.
  #
  # This line is the source of truth, but it is not the only place the revision
  # appears: README.md, crs/README.md and docs/evaluation.md all quote it, in
  # five places altogether. An earlier version of this comment claimed they
  # "cannot drift apart", which was a hope rather than a mechanism — nothing
  # compared them. tests/test_documented_figures.py now does, and it also fails
  # when a new file starts quoting the revision without being listed there.
  # Bump this value and the suite names every file still on the old one.
  CRS_COMMIT: d694d465951ee06347214f1291ae096e40700001

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The gui extra is needed even though nothing is run: PyQt6 ships its own
      # stubs, and without them every Qt class is Any, so mypy both misses real
      # mistakes and invents fake ones about subclassing Any.
      - run: pip install -e ".[dev,gui]"
      - name: Type check
        run: mypy src/logarc
      # Not redundant. mypy analyses for the platform it runs on, so a branch
      # guarded by `sys.platform == "win32"` is skipped here and checked there.
      # Checking one platform passes code the other rejects — which is exactly
      # how the Windows-only memory probe reached main broken.
      - name: Type check as Windows
        run: mypy --platform win32 src/logarc

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Qt needs these even to render offscreen. Without them PyQt6 imports and
      # then fails to start a platform plugin, and the GUI tests skip themselves
      # rather than fail — the quiet outcome, which is the wrong one.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -e ".[dev,gui]"

      # The CRS sidecar is built here rather than left unbuilt, because the
      # contract tests skip themselves without it — and they are the only tests
      # that exercise the Python/Go boundary. Four quiet skips behind a green
      # tick left the newest and least-proven code in the project unverified.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: crs/go.mod
          cache-dependency-path: crs/go.sum

      - name: Fetch the CRS ruleset
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/coreruleset/coreruleset.git vendor/coreruleset
          git -C vendor/coreruleset checkout --detach "$CRS_COMMIT"

      # `logarc` looks for crs-sidecar.exe on Windows and crs-sidecar elsewhere,
      # because a Windows interpreter cannot spawn an ELF. Built on both runners
      # rather than Linux only: this project ships a Windows desktop application,
      # so Windows is where the binary most needs to be known to work.
      - name: Build the CRS sidecar
        shell: bash
        working-directory: crs
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o crs-sidecar.exe .
          else
            go build -o crs-sidecar .
          fi

      # The engine and the window are run separately, and the reason is a
      # crash rather than tidiness. The GUI suite segfaults on the Linux
      # runners now and then — twice so far, on different Python versions and
      # in different tests, always inside `MainWindow.__init__` building a
      # `QAction`. Exit 139 takes the whole pytest process with it, so in one
      # run that meant losing the result of 1,100 tests that had nothing to do
      # with Qt.
      #
      # Split, a crash in the window costs the window's results and nothing
      # else, and the failure reads as "the GUI suite crashed" instead of
      # "pytest exited 139". It does not fix the crash and is not meant to:
      # `TODO.md` carries what is known about it, including three attempted
      # fixes that measured worse.
      #
      # `--cov-append` on the second run is what keeps one coverage figure
      # across the two.
      #
      # And the floor is checked once, at the end. The engine alone covers 56%
      # of the package — the window is a third of it and none of that is run
      # here — so enforcing the 94% floor on this half would fail every build
      # for the arithmetic rather than for anything wrong. The number only
      # means something once both halves are in it.
      - name: Test the engine
        env:
          # Turns the contract tests' skip into a failure. Without it a build
          # step that broke would land us back where we started, silently.
          LOGARC_REQUIRE_CRS: "1"
        run: >
          pytest --ignore=tests/gui
          --cov=logarc --cov-report=term-missing --cov-report=xml
          --cov-fail-under=0

      - name: Test the window
        env:
          QT_QPA_PLATFORM: offscreen
          LOGARC_REQUIRE_CRS: "1"
        run: >
          pytest tests/gui
          --cov=logarc --cov-append --cov-report=term-missing --cov-report=xml

      # Coverage was measured on every run and then thrown away: `coverage.xml`
      # was written and nothing ever read it, so the only way to learn the
      # number was to run the suite yourself.
      #
      # A badge would need an account with a coverage service, which this
      # project does not have and does not need one for. The job summary is
      # where a reader already goes to see whether the run passed, and it costs
      # nothing. `fail_under` in pyproject.toml is still the thing that can fail
      # the build; this step only reports.
      # `--fail-under=0` on both calls, deliberately. `coverage report` exits
      # non-zero below pyproject's floor, so without it a coverage dip would
      # fail the build twice: once correctly, in the step above, and once here
      # for nothing. Reporting must not be able to fail a run.
      - name: Report coverage
        if: always()
        shell: bash
        run: |
          total=$(python -m coverage report --format=total --fail-under=0 2>/dev/null || echo "?")
          {
            echo "### Coverage: ${total}% — floor is 94%"
            echo ""
            echo '```'
            python -m coverage report --skip-covered --sort=cover --fail-under=0 2>/dev/null \
              | tail -25 || echo "no coverage data for this run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
