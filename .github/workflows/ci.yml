name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The gui extra is needed even though nothing is run: PyQt6 ships its own
      # stubs, and without them every Qt class is Any, so mypy both misses real
      # mistakes and invents fake ones about subclassing Any.
      - run: pip install -e ".[dev,gui]"
      - name: Type check
        run: mypy src/logarc
      # Not redundant. mypy analyses for the platform it runs on, so a branch
      # guarded by `sys.platform == "win32"` is skipped here and checked there.
      # Checking one platform passes code the other rejects — which is exactly
      # how the Windows-only memory probe reached main broken.
      - name: Type check as Windows
        run: mypy --platform win32 src/logarc

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Qt needs these even to render offscreen. Without them PyQt6 imports and
      # then fails to start a platform plugin, and the GUI tests skip themselves
      # rather than fail — the quiet outcome, which is the wrong one.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -e ".[dev,gui]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=logarc --cov-report=term-missing --cov-report=xml
